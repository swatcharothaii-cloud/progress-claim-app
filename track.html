<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Claim Status / ตรวจสอบสถานะเบิกงวดงาน / 工程款申请进度查询</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <div class="brand-bar" id="brand-bar"></div>

  <div class="app-header">
    <h1>🔎 Progress Claim Status / ตรวจสอบสถานะเบิกงวดงาน / 工程款申请进度查询</h1>
    <p>Select a project to view its progress claim records (read-only). / เลือกโปรเจกต์เพื่อดูรายการเบิกงวดงานของโปรเจกต์นั้น (ดูอย่างเดียว) / 选择项目以查看该项目的工程款申请记录（仅查看）</p>
  </div>

  <section class="tab-panel">
    <div class="card">
      <div class="field">
        <label>Project * / โปรเจกต์ * / 项目 *</label>
        <select id="project-select">
          <option value="">-- Select a project -- / -- เลือกโปรเจกต์ -- / -- 请选择项目 --</option>
        </select>
      </div>
    </div>

    <div id="claim-list" style="margin-top:20px;"></div>
  </section>

</div>

<!-- ============ IMAGE LIGHTBOX ============ -->
<div class="lightbox-overlay" id="lightbox-modal" style="display:none;">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev">‹</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightbox-next">›</button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<div id="app-footer" class="app-footer"></div>
<div id="toast-container"></div>

<script type="module" src="js/track.js"></script>
</body>
</html>
